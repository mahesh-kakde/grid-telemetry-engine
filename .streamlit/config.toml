[server]
headless = true
enableCORS = true
enableXsrfProtection = true
enableWebsocketCompression = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0066cc"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
font = "sans serif"