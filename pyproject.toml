[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-telemetry-engine"
version = "2.0.0"
description = "Probabilistic power grid telemetry, anomaly detection, and covariate drift monitoring engine"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"