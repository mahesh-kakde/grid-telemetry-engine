services:
  - type: web
    name: grid-telemetry-engine
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SUPABASE_DB_URL
        sync: false
      - key: ARTIFACTS_PATH
        value: "artifacts"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"