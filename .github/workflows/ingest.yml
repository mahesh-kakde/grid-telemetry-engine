name: 6-Hour Grid Telemetry Ingestion, Scoring & Drift Engine

on:
  schedule:
    # 15 minutes past 00:00, 06:00, 12:00, 18:00 utc
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: telemetry-ingestion-lock
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Initialize Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Live Telemetry & Persist to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m src.ingestion.fetch_telemetry

      - name: Generate Multi-Horizon Forecasts & Detect Anomalies
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ARTIFACTS_PATH: "artifacts"
        run: python -m src.models.infer_and_detect

      - name: Run Statistical Drift Evaluation (Evidently AI)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RENDER_TRIGGER_URL: ${{ secrets.RENDER_TRIGGER_URL }}
        run: python -m src.monitoring.drift_check

      - name: Precompute Inference Artifacts & Drift Snapshots
        env:
          ARTIFACTS_PATH: "artifacts"
        run: python -m src.models.precompute