name: 6-Hour Grid Telemetry Ingestion, Scoring & Drift Engine

on:
  schedule:
    # 15 minutes past 00:00, 06:00, 12:00, 18:00 utc
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telemetry-ingestion-lock
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize Python 3.12 Runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify Database Secret Configured
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "ERROR: SUPABASE_DB_URL secret is empty; aborting scheduled pipeline."
            exit 1
          fi

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Live Weather & Calibrated Telemetry to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m src.ingestion.fetch_telemetry

      - name: Generate Multi-Horizon Forecasts & Detect Anomalies
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ARTIFACTS_PATH: "artifacts"
        run: python -m src.models.infer_and_detect

      - name: Evaluate Drift & Publish Live Dashboard Snapshots to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ARTIFACTS_PATH: "artifacts"
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m src.models.precompute

      - name: Prune Expired Database Records (90-Day Retention)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RETENTION_DAYS: 90
        run: python -m src.ingestion.cleanup