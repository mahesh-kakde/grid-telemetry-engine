name: CI Test Runner

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize Python 3.12 Runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Runtime & Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Static Lint & Syntax Gates
        run: |
          ruff check --select E9,F63,F7,F82 src tests
          python -m compileall -q src tests

      - name: Execute Pytest & PostgreSQL Integration Suite
        env:
          ARTIFACTS_PATH: "artifacts"
          TEST_POSTGRES_URL: "postgresql://postgres:postgres@localhost:5432/grid_test"
        run: pytest tests/ -v --tb=short

      - name: Audit Runtime Dependencies (Advisory)
        continue-on-error: true
        run: pip-audit -r requirements.txt